<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Photo Harmony - Luxury AR & Slide AR Camera</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      touch-action: none;
      color: #f7f3ed;
    }

    /* 1. 背景カメラ映像 */
    #webcam {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
    }

    /* 2. ARキャンバス（ハートエフェクト） */
    #ar-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    /* 3. オーバーレイ・スライドショー層 */
    #slide-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3;
      touch-action: none;
    }
    #slide-img {
      max-width: 75vw;
      max-height: 60vh;
      object-fit: contain;
      transform-origin: center center;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
      transition: opacity 0.2s;
    }
    #slide-img.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* UIコントロール（上部ヘッダー） */
    #top-controls {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: rgba(15, 15, 15, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 12px;
      border-radius: 25px;
      border: 1px solid rgba(228, 195, 139, 0.4);
      z-index: 10;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      align-items: center;
    }
    .control-btn {
      background: transparent;
      border: 1px solid rgba(228, 195, 139, 0.5);
      color: #f7f3ed;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 10px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
      white-space: nowrap;
    }
    .control-btn:active {
      transform: scale(0.95);
      background: rgba(228, 195, 139, 0.2);
    }
    .control-btn.active {
      background: rgba(228, 195, 139, 0.3);
      border-color: #e4c38b;
    }

    #info-overlay {
      position: fixed;
      top: 62px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(247, 243, 237, 0.85);
      font-size: 9.5px;
      letter-spacing: 0.05em;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      white-space: nowrap;
    }
    #status { font-weight: 600; color: #e4c38b; }

    /* シャッター・操作バー（下部） */
    #shutter-container {
      position: fixed;
      bottom: 30px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      z-index: 10;
    }
    #shutter-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d8c4b6 50%, #b8977e 100%);
      border: 3px solid rgba(228, 195, 139, 0.95);
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), inset 0 2px 6px rgba(255,255,255,0.95);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
      outline: none;
    }
    #shutter-btn:active {
      transform: scale(0.92);
    }

    .icon-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(15, 15, 15, 0.7);
      border: 1px solid rgba(228, 195, 139, 0.5);
      color: #e4c38b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      font-size: 18px;
      position: relative;
    }
    .icon-btn:active { transform: scale(0.92); }
    #badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #e4c38b;
      color: #000;
      font-size: 10px;
      font-weight: bold;
      border-radius: 10px;
      padding: 2px 6px;
      display: none;
    }

    /* モーダル表示 */
    #album-modal, #qr-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(10, 10, 12, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 100;
      display: none;
      flex-direction: column;
    }
    .modal-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(228, 195, 139, 0.2);
    }
    .modal-title { font-size: 15px; font-weight: 600; color: #e4c38b; }
    .close-btn { background: none; border: none; color: #f7f3ed; font-size: 22px; cursor: pointer; }
    .album-grid {
      flex: 1; overflow-y: auto; padding: 15px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px; align-content: start;
    }
    .album-item {
      position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden;
      border: 1px solid rgba(228, 195, 139, 0.3); background: #111;
    }
    .album-item img { width: 100%; height: 100%; object-fit: cover; }
    .album-item .time-tag {
      position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.6);
      font-size: 8px; padding: 2px 4px; border-radius: 4px; color: #e4c38b;
    }
    .empty-state { grid-column: 1 / -1; text-align: center; color: #888; font-size: 13px; margin-top: 60px; }
    
    .qr-container {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center;
    }
    #qrcode { background: #fff; padding: 16px; border-radius: 16px; margin-bottom: 20px; }
    .qr-desc { font-size: 12px; color: #ccc; line-height: 1.6; max-width: 280px; }

    #flash {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #fff; opacity: 0; pointer-events: none; z-index: 50; transition: opacity 0.15s ease-out;
    }
  </style>

  <!-- Face-api.js & QR生成ライブラリ -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <!-- 1. 背景カメラ映像 -->
  <video id="webcam" autoplay playsinline muted></video>

  <!-- 2. ARキャンバス (ハートパーティクル) -->
  <div id="ar-layer">
    <canvas id="ar-canvas"></canvas>
  </div>

  <!-- 3. イラストスライドオーバーレイ (ドラッグ/ピンチ/タップ操作) -->
  <div id="slide-container">
    <img id="slide-img" src="1.jpg" alt="スライド">
  </div>

  <!-- ヘッダーUI -->
  <div id="top-controls">
    <button class="control-btn" id="effect-btn" onclick="toggleEffectPower()">FX: Mid</button>
    <button class="control-btn" id="slide-toggle-btn" onclick="toggleSlideShow()">スライド: ON</button>
    <div style="width: 1px; height: 14px; background: rgba(228,195,139,0.3); margin: 0 2px;"></div>
    <button class="control-btn" onclick="switchCamera()">Cam ⟳</button>
  </div>

  <div id="info-overlay">
    PHOTO HARMONY | <span id="status">カメラ起動中...</span>
  </div>

  <div id="flash"></div>

  <!-- フッター操作バー -->
  <div id="shutter-container">
    <button class="icon-btn" onclick="openQRModal()" title="共有用QRを表示">
      <span>📱</span>
    </button>

    <button id="shutter-btn" title="Capture"></button>

    <button class="icon-btn" onclick="openAlbumModal()" title="共有アルバムを開く">
      <span>🖼️</span>
      <span id="badge">0</span>
    </button>
  </div>

  <!-- 共有アルバムモーダル -->
  <div id="album-modal">
    <div class="modal-header">
      <div class="modal-title">PHOTO HARMONY ALBUM</div>
      <button class="close-btn" onclick="closeAlbumModal()">✕</button>
    </div>
    <div class="album-grid" id="album-grid">
      <div class="empty-state">まだ写真がありません。<br>シャッターを押して撮影・共有しましょう！</div>
    </div>
  </div>

  <!-- QRコード表示モーダル -->
  <div id="qr-modal">
    <div class="modal-header">
      <div class="modal-title">同じQRでカメラ・共有に参加</div>
      <button class="close-btn" onclick="closeQRModal()">✕</button>
    </div>
    <div class="qr-container">
      <div id="qrcode"></div>
      <div class="qr-desc">
        このQRコードを別のスマホカメラで読み込むと、同じARカメラ＆共有アルバムに参加できます。
      </div>
    </div>
  </div>

  <script>
    const webcamEl = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const arCanvas = document.getElementById('ar-canvas');
    const ctx = arCanvas.getContext('2d');
    const shutterBtn = document.getElementById('shutter-btn');
    const badgeEl = document.getElementById('badge');
    const flashEl = document.getElementById('flash');

    const slideContainer = document.getElementById('slide-container');
    const slideImg = document.getElementById('slide-img');

    // 10枚のイラスト画像リスト
    const images = [
      '1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg',
      '6.jpg', '7.jpg', '8.jpg', '9.jpg', '10.jpg'
    ];
    let currentIndex = 0;
    let isSlideVisible = true;

    // --- カメラ＆ズーム制御 ---
    let currentZoom = 1;
    let useFrontCamera = false;
    let currentStream = null;
    let faces = [];

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: useFrontCamera ? "user" : { exact: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        webcamEl.srcObject = currentStream;
        
        webcamEl.onloadedmetadata = () => {
          startFaceDetection();
          updateStatusText();
        };
      } catch (err) {
        try {
          const fallbackConstraints = { video: true, audio: false };
          currentStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
          webcamEl.srcObject = currentStream;
          webcamEl.onloadedmetadata = () => {
            startFaceDetection();
            updateStatusText();
          };
        } catch (e) {
          statusEl.textContent = "カメラエラー: 権限を確認してください";
          console.error(e);
        }
      }
    }

    function switchCamera() {
      useFrontCamera = !useFrontCamera;
      initCamera();
    }

    function updateStatusText() {
      const camName = useFrontCamera ? "FRONT" : "BACK";
      statusEl.textContent = `${camName} CAM | イラスト (${currentIndex + 1}/${images.length}枚目)`;
    }

    // --- リアルタイム写真共有機能 (BroadcastChannel) ---
    const sharedPhotos = [];
    const broadcastChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('photo_harmony_sync') : null;

    if (broadcastChannel) {
      broadcastChannel.onmessage = (event) => {
        if (event.data && event.data.type === 'NEW_PHOTO') {
          sharedPhotos.unshift(event.data.photo);
          updateAlbumView();
          showBadgeNotification();
        }
      };
    }

    function addPhotoToShared(dataUrl) {
      const photoObj = {
        id: Date.now(),
        dataUrl: dataUrl,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };
      sharedPhotos.unshift(photoObj);
      updateAlbumView();

      if (broadcastChannel) {
        broadcastChannel.postMessage({ type: 'NEW_PHOTO', photo: photoObj });
      }
    }

    function updateAlbumView() {
      const grid = document.getElementById('album-grid');
      if (sharedPhotos.length === 0) {
        grid.innerHTML = '<div class="empty-state">まだ写真がありません。<br>シャッターを押して撮影・共有しましょう！</div>';
        badgeEl.style.display = 'none';
        return;
      }

      badgeEl.textContent = sharedPhotos.length;
      badgeEl.style.display = 'block';

      grid.innerHTML = sharedPhotos.map(p => `
        <div class="album-item" onclick="downloadImage('${p.dataUrl}')">
          <img src="${p.dataUrl}" alt="Photo">
          <div class="time-tag">${p.time}</div>
        </div>
      `).join('');
    }

    function downloadImage(dataUrl) {
      const link = document.createElement('a');
      link.download = 'photo_harmony_' + Date.now() + '.jpg';
      link.href = dataUrl;
      link.click();
    }

    function showBadgeNotification() {
      badgeEl.style.transform = 'scale(1.4)';
      setTimeout(() => { badgeEl.style.transform = 'scale(1)'; }, 200);
    }

    // --- Face-api.js (顔認識回避) ---
    async function loadModels() {
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    }

    async function startFaceDetection() {
      if (!faceapi.nets.tinyFaceDetector.params) {
        await loadModels();
      }
      detectFaces();
    }

    async function detectFaces() {
      if (webcamEl.paused || webcamEl.ended || !faceapi.nets.tinyFaceDetector.params) {
        requestAnimationFrame(detectFaces);
        return;
      }

      const detections = await faceapi.detectAllFaces(webcamEl, new faceapi.TinyFaceDetectorOptions());
      const displaySize = { width: arCanvas.width / dpr, height: arCanvas.height / dpr };
      faces = faceapi.resizeResults(detections, displaySize);
      
      requestAnimationFrame(detectFaces);
    }

    // --- スライドイラストのタッチ操作 (タップ切替 / ピンチ拡大縮小 / ドラッグ移動) ---
    let scale = 1;
    let posX = 0;
    let posY = 0;
    let startX = 0;
    let startY = 0;
    let initialDistance = null;
    let initialScale = 1;
    let isDragging = false;
    let touchStartTime = 0;
    let hasMoved = false;

    slideContainer.addEventListener('touchstart', (e) => {
      touchStartTime = Date.now();
      hasMoved = false;

      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - posX;
        startY = e.touches[0].clientY - posY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = scale;
      }
    }, { passive: false });

    slideContainer.addEventListener('touchmove', (e) => {
      e.preventDefault();
      hasMoved = true;

      if (e.touches.length === 1 && isDragging) {
        posX = e.touches[0].clientX - startX;
        posY = e.touches[0].clientY - startY;
        updateTransform();
      } else if (e.touches.length === 2 && initialDistance !== null && initialDistance > 0) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        scale = Math.max(0.2, Math.min(5.0, initialScale * factor));
        updateTransform();
      }
    }, { passive: false });

    slideContainer.addEventListener('touchend', (e) => {
      if (!hasMoved && (Date.now() - touchStartTime < 300) && isSlideVisible) {
        currentIndex = (currentIndex + 1) % images.length;
        slideImg.src = images[currentIndex];
        updateStatusText();
      }

      if (e.touches.length === 0) {
        isDragging = false;
        initialDistance = null;
      }
    });

    function updateTransform() {
      slideImg.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }

    function toggleSlideShow() {
      isSlideVisible = !isSlideVisible;
      const btn = document.getElementById('slide-toggle-btn');
      if (isSlideVisible) {
        slideImg.classList.remove('hidden');
        btn.textContent = 'スライド: ON';
        btn.classList.remove('active');
      } else {
        slideImg.classList.add('hidden');
        btn.textContent = 'スライド: OFF';
        btn.classList.add('active');
      }
    }

    // --- Canvas Resize & DPR ---
    let dpr = window.devicePixelRatio || 1;

    function resizeCanvas() {
      dpr = window.devicePixelRatio || 1;
      const width = window.innerWidth;
      const height = window.innerHeight;

      arCanvas.width = width * dpr;
      arCanvas.height = height * dpr;
      arCanvas.style.width = width + 'px';
      arCanvas.style.height = height + 'px';
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- ARエフェクト (ハートパーティクル) ---
    let effectPowerLevel = 2;
    function toggleEffectPower() {
      effectPowerLevel = (effectPowerLevel % 3) + 1;
      const names = { 1: 'Low', 2: 'Mid', 3: 'High' };
      document.getElementById('effect-btn').textContent = `FX: ${names[effectPowerLevel]}`;
    }

    const particles = [];
    const pastelColors = ['#FFB6C1', '#FFD1DC', '#FFCCFF', '#E6E6FA', '#D8BFD8', '#B0E0E6', '#98FB98', '#FFFFE0'];

    for (let i = 0; i < 100; i++) {
      particles.push({
        type: 'heart',
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 20 + 8,
        speedY: Math.random() * 2.0 + 1.0,
        speedX: (Math.random() - 0.5) * 1.5,
        opacity: Math.random() * 0.5 + 0.5,
        color: pastelColors[Math.floor(Math.random() * pastelColors.length)],
        onFace: false
      });
    }

    let timeCount = 0;

    function drawHeart(ctx, x, y, size, color, opacity, onFace) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate((timeCount * 0.2) + x * 0.01);
      
      ctx.globalAlpha = onFace ? opacity * 0.1 : opacity;
      ctx.fillStyle = color;
      ctx.beginPath();
      const width = size;
      const height = size * 0.9;
      ctx.moveTo(0, height * 0.3);
      ctx.bezierCurveTo(0, 0, -width * 0.5, 0, -width * 0.5, height * 0.3);
      ctx.bezierCurveTo(-width * 0.5, height * 0.6, -width * 0.2, height * 0.8, 0, height);
      ctx.bezierCurveTo(width * 0.2, height * 0.8, width * 0.5, height * 0.6, width * 0.5, height * 0.3);
      ctx.bezierCurveTo(width * 0.5, 0, 0, 0, 0, height * 0.3);
      ctx.fill();
      ctx.restore();
    }

    function renderLoop() {
      timeCount += 0.016;
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      ctx.clearRect(0, 0, logicalWidth, logicalHeight);
      const activeCount = effectPowerLevel === 1 ? 0.4 : (effectPowerLevel === 2 ? 0.7 : 1.2);

      particles.forEach((p) => {
        p.y += p.speedY * activeCount;
        p.x += p.speedX * activeCount * 0.5;

        if (p.y > logicalHeight + 40 || p.x < -40 || p.x > logicalWidth + 40) {
          p.y = -40;
          p.x = Math.random() * logicalWidth;
          p.color = pastelColors[Math.floor(Math.random() * pastelColors.length)];
        }

        p.onFace = false;
        if (faces.length > 0) {
          for (const face of faces) {
            const { x, y, width, height } = face.box;
            if (p.x > x && p.x < x + width && p.y > y && p.y < y + height) {
              p.onFace = true;
              break;
            }
          }
        }

        if (effectPowerLevel > 0) {
          drawHeart(ctx, p.x, p.y, p.size, p.color, p.opacity, p.onFace);
        }
      });

      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // --- 撮影・合成 (カメラ + ARハート + イラストスライド) ---
    shutterBtn.addEventListener('click', async () => {
      flashEl.style.opacity = '0.8';
      setTimeout(() => { flashEl.style.opacity = '0'; }, 150);

      const saveCanvas = document.createElement('canvas');
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;
      
      saveCanvas.width = logicalWidth * dpr;
      saveCanvas.height = logicalHeight * dpr;
      const saveCtx = saveCanvas.getContext('2d');
      saveCtx.scale(dpr, dpr);

      // 1. カメラ映像の描画
      if (webcamEl.readyState === webcamEl.HAVE_ENOUGH_DATA) {
        const vW = webcamEl.videoWidth;
        const vH = webcamEl.videoHeight;
        const vRatio = vW / vH;
        const cRatio = logicalWidth / logicalHeight;

        let dw = logicalWidth, dh = logicalHeight, dx = 0, dy = 0;
        if (vRatio > cRatio) {
          dw = logicalHeight * vRatio;
          dx = (logicalWidth - dw) / 2;
        } else {
          dh = logicalWidth / vRatio;
          dy = (logicalHeight - dh) / 2;
        }

        saveCtx.drawImage(webcamEl, dx, dy, dw, dh);
      }

      // 2. ARパーティクル描画の合成
      saveCtx.drawImage(arCanvas, 0, 0, logicalWidth, logicalHeight);

      // 3. スライドイラストの合成（表示されている場合）
      if (isSlideVisible && slideImg.complete && slideImg.naturalWidth !== 0) {
        const imgRect = slideImg.getBoundingClientRect();
        
        saveCtx.save();
        saveCtx.translate(imgRect.left + imgRect.width / 2, imgRect.top + imgRect.height / 2);
        saveCtx.scale(scale, scale);
        saveCtx.drawImage(
          slideImg, 
          -imgRect.width / (2 * scale), 
          -imgRect.height / (2 * scale), 
          imgRect.width / scale, 
          imgRect.height / scale
        );
        saveCtx.restore();
      }

      const jpgDataUrl = saveCanvas.toDataURL('image/jpeg', 0.88);

      // ローカル保存
      const link = document.createElement('a');
      link.download = 'photo_harmony_' + Date.now() + '.jpg';
      link.href = jpgDataUrl;
      link.click();

      // 共有アルバムに追加
      addPhotoToShared(jpgDataUrl);

      const origText = statusEl.textContent;
      statusEl.textContent = "SHARED & SAVED!";
      setTimeout(() => { updateStatusText(); }, 2500);
    });

    // --- モーダル ＆ QRコード制御 ---
    function openAlbumModal() { document.getElementById('album-modal').style.display = 'flex'; }
    function closeAlbumModal() { document.getElementById('album-modal').style.display = 'none'; }

    let qrGenerated = false;
    function openQRModal() {
      const modal = document.getElementById('qr-modal');
      modal.style.display = 'flex';

      if (!qrGenerated) {
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, {
          text: window.location.href,
          width: 180,
          height: 180,
          colorDark: "#111111",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
        qrGenerated = true;
      }
    }
    function closeQRModal() { document.getElementById('qr-modal').style.display = 'none'; }

    // 初期化起動
    initCamera();

  </script>
</body>
</html>
