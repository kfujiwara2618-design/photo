<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Photo Harmony - Luxury Pro AR Camera & Shared Album</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      touch-action: none;
      color: #f7f3ed;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
    }
    #ar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #top-controls {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(15, 15, 15, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 14px;
      border-radius: 25px;
      border: 1px solid rgba(228, 195, 139, 0.4);
      z-index: 10;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      align-items: center;
    }
    .control-btn {
      background: transparent;
      border: 1px solid rgba(228, 195, 139, 0.5);
      color: #f7f3ed;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 11px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .control-btn:active {
      transform: scale(0.95);
      background: rgba(228, 195, 139, 0.2);
    }
    #info-overlay {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(247, 243, 237, 0.85);
      font-size: 10px;
      letter-spacing: 0.08em;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      white-space: nowrap;
    }
    #status { font-weight: 600; color: #e4c38b; }
    
    #shutter-container {
      position: absolute;
      bottom: 35px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      z-index: 10;
    }
    #shutter-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d8c4b6 50%, #b8977e 100%);
      border: 3px solid rgba(228, 195, 139, 0.95);
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), inset 0 2px 6px rgba(255,255,255,0.95);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s ease;
      outline: none;
    }
    #shutter-btn:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 1px 3px rgba(0,0,0,0.4);
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(15, 15, 15, 0.7);
      border: 1px solid rgba(228, 195, 139, 0.5);
      color: #e4c38b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      font-size: 18px;
      position: relative;
    }
    .icon-btn:active {
      transform: scale(0.92);
    }
    #badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #e4c38b;
      color: #000;
      font-size: 10px;
      font-weight: bold;
      border-radius: 10px;
      padding: 2px 6px;
      display: none;
    }

    /* アルバムモーダル */
    #album-modal, #qr-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 10, 12, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 100;
      display: none;
      flex-direction: column;
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(228, 195, 139, 0.2);
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #e4c38b;
    }
    .close-btn {
      background: none;
      border: none;
      color: #f7f3ed;
      font-size: 24px;
      cursor: pointer;
    }
    .album-grid {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
      align-content: start;
    }
    .album-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(228, 195, 139, 0.3);
      background: #111;
    }
    .album-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .album-item .time-tag {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0,0,0,0.6);
      font-size: 9px;
      padding: 2px 4px;
      border-radius: 4px;
      color: #e4c38b;
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-top: 60px;
    }
    
    /* QRコード表示モーダル */
    .qr-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    #qrcode {
      background: #fff;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }
    .qr-desc {
      font-size: 13px;
      color: #ccc;
      line-height: 1.6;
      max-width: 280px;
    }

    /* フラッシュエフェクト */
    #flash {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity 0.1s ease-out;
    }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>

  <div id="top-controls">
    <button class="control-btn" id="effect-btn" onclick="toggleEffectPower()">FX: Mid</button>
    <div style="width: 1px; height: 16px; background: rgba(228,195,139,0.3); margin: 0 2px;"></div>
    <button class="control-btn" onclick="switchCamera()">Cam ⟳</button>
  </div>

  <div id="info-overlay">
    PHOTO HARMONY | <span id="status">MODEL LOADING...</span> | リアルタイム共有
  </div>

  <div id="ar-layer">
    <canvas id="ar-canvas"></canvas>
  </div>

  <div id="flash"></div>

  <div id="shutter-container">
    <button class="icon-btn" onclick="openQRModal()" title="共有用QRを表示">
      <span>📱</span>
    </button>

    <button id="shutter-btn" title="Capture"></button>

    <button class="icon-btn" onclick="openAlbumModal()" title="共有アルバムを開く">
      <span>🖼️</span>
      <span id="badge">0</span>
    </button>
  </div>

  <!-- 共有アルバムモーダル -->
  <div id="album-modal">
    <div class="modal-header">
      <div class="modal-title">PHOTO HARMONY ALBUM</div>
      <button class="close-btn" onclick="closeAlbumModal()">✕</button>
    </div>
    <div class="album-grid" id="album-grid">
      <div class="empty-state">まだ写真がありません。<br>シャッターを押して投稿しましょう！</div>
    </div>
  </div>

  <!-- QRコード表示モーダル -->
  <div id="qr-modal">
    <div class="modal-header">
      <div class="modal-title">同じQRでカメラ・共有に参加</div>
      <button class="close-btn" onclick="closeQRModal()">✕</button>
    </div>
    <div class="qr-container">
      <div id="qrcode"></div>
      <div class="qr-desc">
        このQRコードを他の人のスマホカメラで読み込むと、同じARカメラが起動し撮影した写真をリアルタイム共有できます。
      </div>
    </div>
  </div>

  <script>
    const webcamEl = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const arCanvas = document.getElementById('ar-canvas');
    const ctx = arCanvas.getContext('2d');
    const shutterBtn = document.getElementById('shutter-btn');
    const badgeEl = document.getElementById('badge');
    const flashEl = document.getElementById('flash');

    let currentZoom = 1;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 10;
    let useFrontCamera = false;
    let currentStream = null;
    let faces = [];

    // --- リアルタイム共有用 (BroadcastChannel / LocalStorage) ---
    const sharedPhotos = [];
    const broadcastChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('photo_harmony_sync') : null;

    if (broadcastChannel) {
      broadcastChannel.onmessage = (event) => {
        if (event.data && event.data.type === 'NEW_PHOTO') {
          sharedPhotos.unshift(event.data.photo);
          updateAlbumView();
          showBadgeNotification();
        }
      };
    }

    function addPhotoToShared(dataUrl) {
      const photoObj = {
        id: Date.now(),
        dataUrl: dataUrl,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };
      sharedPhotos.unshift(photoObj);
      updateAlbumView();

      if (broadcastChannel) {
        broadcastChannel.postMessage({ type: 'NEW_PHOTO', photo: photoObj });
      }
    }

    function updateAlbumView() {
      const grid = document.getElementById('album-grid');
      if (sharedPhotos.length === 0) {
        grid.innerHTML = '<div class="empty-state">まだ写真がありません。<br>シャッターを押して投稿しましょう！</div>';
        badgeEl.style.display = 'none';
        return;
      }

      badgeEl.textContent = sharedPhotos.length;
      badgeEl.style.display = 'block';

      grid.innerHTML = sharedPhotos.map(p => `
        <div class="album-item" onclick="downloadImage('${p.dataUrl}')">
          <img src="${p.dataUrl}" alt="Photo">
          <div class="time-tag">${p.time}</div>
        </div>
      `).join('');
    }

    function downloadImage(dataUrl) {
      const link = document.createElement('a');
      link.download = 'photo_harmony_' + Date.now() + '.jpg';
      link.href = dataUrl;
      link.click();
    }

    function showBadgeNotification() {
      badgeEl.style.transform = 'scale(1.4)';
      setTimeout(() => { badgeEl.style.transform = 'scale(1)'; }, 200);
    }

    // --- カメラ制御 ---
    function applyZoom(level) {
      currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, level));
      webcamEl.style.transform = `scale(${currentZoom})`;
    }

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: useFrontCamera ? "user" : { exact: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        webcamEl.srcObject = currentStream;
        
        webcamEl.onloadedmetadata = () => {
          startFaceDetection();
          statusEl.textContent = useFrontCamera ? "FRONT CAM" : "BACK CAM";
        };
      } catch (err) {
        try {
          const fallbackConstraints = { video: true, audio: false };
          currentStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
          webcamEl.srcObject = currentStream;
          
          webcamEl.onloadedmetadata = () => {
            startFaceDetection();
            statusEl.textContent = "READY";
          };
        } catch (e) {
          statusEl.textContent = "CAMERA ERROR";
          console.error(e);
        }
      }
    }

    function switchCamera() {
      useFrontCamera = !useFrontCamera;
      initCamera();
    }

    // --- Face-api.js ---
    async function loadModels() {
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      statusEl.textContent = "MODEL LOADED";
    }

    async function startFaceDetection() {
      if (!faceapi.nets.tinyFaceDetector.params) {
        await loadModels();
      }
      detectFaces();
    }

    async function detectFaces() {
      if (webcamEl.paused || webcamEl.ended || !faceapi.nets.tinyFaceDetector.params) {
        requestAnimationFrame(detectFaces);
        return;
      }

      const detections = await faceapi.detectAllFaces(webcamEl, new faceapi.TinyFaceDetectorOptions());
      const displaySize = { width: arCanvas.width / dpr, height: arCanvas.height / dpr };
      faces = faceapi.resizeResults(detections, displaySize);
      
      requestAnimationFrame(detectFaces);
    }

    // --- ピンチズーム ---
    let initialPinchDistance = null;
    let zoomStartValue = 1;

    function getPinchDistance(touches) {
      if (touches.length < 2) return 0;
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialPinchDistance = getPinchDistance(e.touches);
        zoomStartValue = currentZoom;
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDistance !== null) {
        const currentDistance = getPinchDistance(e.touches);
        if (initialPinchDistance > 0) {
          const distanceRatio = currentDistance / initialPinchDistance;
          const newZoom = zoomStartValue * distanceRatio;
          applyZoom(newZoom);
        }
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialPinchDistance = null;
      }
    });

    // --- Canvas Resize ---
    let dpr = window.devicePixelRatio || 1;

    function resizeCanvas() {
      dpr = window.devicePixelRatio || 1;
      const width = window.innerWidth;
      const height = window.innerHeight;

      arCanvas.width = width * dpr;
      arCanvas.height = height * dpr;
      arCanvas.style.width = width + 'px';
      arCanvas.style.height = height + 'px';
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- エフェクトレベル ---
    let effectPowerLevel = 2;
    function toggleEffectPower() {
      effectPowerLevel = (effectPowerLevel % 3) + 1;
      const names = { 1: 'Low', 2: 'Mid', 3: 'High' };
      document.getElementById('effect-btn').textContent = `FX: ${names[effectPowerLevel]}`;
    }

    // --- パーティクルシステム ---
    const particles = [];
    const pastelColors = ['#FFB6C1', '#FFD1DC', '#FFCCFF', '#E6E6FA', '#D8BFD8', '#B0E0E6', '#98FB98', '#FFFFE0'];

    for (let i = 0; i < 100; i++) {
      particles.push({
        type: 'heart',
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 20 + 8,
        speedY: Math.random() * 2.0 + 1.0,
        speedX: (Math.random() - 0.5) * 1.5,
        opacity: Math.random() * 0.5 + 0.5,
        color: pastelColors[Math.floor(Math.random() * pastelColors.length)],
        onFace: false
      });
    }

    let timeCount = 0;

    function drawHeart(ctx, x, y, size, color, opacity, onFace) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate((timeCount * 0.2) + x * 0.01);
      
      if (onFace) {
        ctx.globalAlpha = opacity * 0.1;
      } else {
        ctx.globalAlpha = opacity;
      }
      
      ctx.fillStyle = color;
      ctx.beginPath();
      const width = size;
      const height = size * 0.9;
      ctx.moveTo(0, height * 0.3);
      ctx.bezierCurveTo(0, 0, -width * 0.5, 0, -width * 0.5, height * 0.3);
      ctx.bezierCurveTo(-width * 0.5, height * 0.6, -width * 0.2, height * 0.8, 0, height);
      ctx.bezierCurveTo(width * 0.2, height * 0.8, width * 0.5, height * 0.6, width * 0.5, height * 0.3);
      ctx.bezierCurveTo(width * 0.5, 0, 0, 0, 0, height * 0.3);
      ctx.fill();
      ctx.restore();
    }

    function renderLoop() {
      timeCount += 0.016;
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      ctx.clearRect(0, 0, logicalWidth, logicalHeight);

      const activeCount = effectPowerLevel === 1 ? 0.4 : (effectPowerLevel === 2 ? 0.7 : 1.2);

      particles.forEach((p) => {
        p.y += p.speedY * activeCount;
        p.x += p.speedX * activeCount * 0.5;

        if (p.y > logicalHeight + 40 || p.x < -40 || p.x > logicalWidth + 40) {
          p.y = -40;
          p.x = Math.random() * logicalWidth;
          p.color = pastelColors[Math.floor(Math.random() * pastelColors.length)];
        }

        p.onFace = false;
        
        if (faces.length > 0) {
          for (const face of faces) {
            const { x, y, width, height } = face.box;
            if (p.x > x && p.x < x + width && p.y > y && p.y < y + height) {
              p.onFace = true;
              break;
            }
          }
        }

        if (effectPowerLevel > 0) {
          drawHeart(ctx, p.x, p.y, p.size, p.color, p.opacity, p.onFace);
        }
      });

      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // --- シャッター ＆ 共有追加 ---
    shutterBtn.addEventListener('click', () => {
      // フラッシュ演出
      flashEl.style.opacity = '0.8';
      setTimeout(() => { flashEl.style.opacity = '0'; }, 150);

      const saveCanvas = document.createElement('canvas');
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;
      
      saveCanvas.width = logicalWidth * dpr;
      saveCanvas.height = logicalHeight * dpr;
      const saveCtx = saveCanvas.getContext('2d');
      saveCtx.scale(dpr, dpr);

      if (webcamEl.readyState === webcamEl.HAVE_ENOUGH_DATA) {
        const vW = webcamEl.videoWidth;
        const vH = webcamEl.videoHeight;
        const vRatio = vW / vH;
        const cRatio = logicalWidth / logicalHeight;

        let dw = logicalWidth, dh = logicalHeight, dx = 0, dy = 0;
        if (vRatio > cRatio) {
          dw = logicalHeight * vRatio;
          dx = (logicalWidth - dw) / 2;
        } else {
          dh = logicalWidth / vRatio;
          dy = (logicalHeight - dh) / 2;
        }

        saveCtx.save();
        saveCtx.translate(logicalWidth / 2, logicalHeight / 2);
        saveCtx.scale(currentZoom, currentZoom);
        saveCtx.translate(-logicalWidth / 2, -logicalHeight / 2);
        saveCtx.drawImage(webcamEl, dx, dy, dw, dh);
        saveCtx.restore();
      }

      // AR描画の重ね合わせ
      saveCtx.drawImage(arCanvas, 0, 0, logicalWidth, logicalHeight);

      const jpgDataUrl = saveCanvas.toDataURL('image/jpeg', 0.85);

      // ローカル保存
      const link = document.createElement('a');
      link.download = 'photo_harmony_' + Date.now() + '.jpg';
      link.href = jpgDataUrl;
      link.click();

      // 共有アルバムに追加
      addPhotoToShared(jpgDataUrl);

      statusEl.textContent = "SHARED & SAVED";
      setTimeout(() => {
        statusEl.textContent = useFrontCamera ? "FRONT CAM" : "BACK CAM";
      }, 2500);
    });

    // --- モーダル制御 ＆ QRコード生成 ---
    function openAlbumModal() {
      document.getElementById('album-modal').style.display = 'flex';
    }
    function closeAlbumModal() {
      document.getElementById('album-modal').style.display = 'none';
    }

    let qrGenerated = false;
    function openQRModal() {
      const modal = document.getElementById('qr-modal');
      modal.style.display = 'flex';

      if (!qrGenerated) {
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, {
          text: window.location.href,
          width: 180,
          height: 180,
          colorDark: "#111111",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
        qrGenerated = true;
      }
    }
    function closeQRModal() {
      document.getElementById('qr-modal').style.display = 'none';
    }

    // 初期化
    initCamera();

  </script>
</body>
</html>
