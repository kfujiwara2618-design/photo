<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>フォトハーモニー ARカメラ</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000;
    }

    /* 情報ヘッダー */
    #info-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      z-index: 999;
      pointer-events: none;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    #status { font-weight: bold; color: #ffd700; }
    .success { color: #51cf66 !important; }
    .error { color: #ff6b6b !important; }

    /* シャッター ＆ アクションエリア */
    #action-container {
      position: absolute;
      bottom: 25px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      z-index: 999;
    }

    #shutter-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: #ffffff;
      border: 5px solid rgba(255, 255, 255, 0.6);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: transform 0.1s;
    }
    #shutter-btn:active {
      transform: scale(0.9);
      background: #ffb7c5;
    }

    /* 共有ギャラリーボタン */
    #gallery-toggle-btn {
      position: absolute;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 共有ギャラリーモーダル */
    #gallery-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      display: none;
      flex-direction: column;
      color: #fff;
      backdrop-filter: blur(10px);
    }
    #gallery-header {
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }
    #gallery-title { font-weight: bold; font-size: 16px; }
    #gallery-close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }
    #gallery-grid {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    #gallery-grid img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .empty-msg {
      grid-column: span 3;
      text-align: center;
      color: #aaa;
      padding: 40px 0;
    }
  </style>

  <!-- A-Frame & MindAR の読み込み -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- キラキラ・さくらのエフェクト -->
  <script>
    AFRAME.registerComponent('sakura-rain', {
      init: function () {
        const el = this.el;
        this.petals = [];
        for (let i = 0; i < 30; i++) {
          const petal = document.createElement('a-plane');
          petal.setAttribute('width', '0.08');
          petal.setAttribute('height', '0.08');
          petal.setAttribute('color', '#ffb7c5');
          petal.setAttribute('material', 'transparent: true; opacity: 0.85; shader: flat;');
          
          const x = (Math.random() - 0.5) * 2.0;
          const y = Math.random() * 1.5 + 0.5;
          const z = (Math.random() - 0.5) * 1.0 - 1.2;
          petal.setAttribute('position', `${x} ${y} ${z}`);
          petal.setAttribute('rotation', `${Math.random()*360} ${Math.random()*360} 0`);
          
          el.appendChild(petal);
          this.petals.push({
            el: petal,
            speedY: 0.002 + Math.random() * 0.003,
            speedX: 0.001 + Math.random() * 0.0015
          });
        }
      },
      tick: function (time, deltaTime) {
        this.petals.forEach((p, index) => {
          const pos = p.el.getAttribute('position');
          pos.y -= p.speedY;
          pos.x += Math.sin(time * 0.002 + index) * p.speedX;
          
          if (pos.y < -0.8) {
            pos.y = 1.2;
            pos.x = (Math.random() - 0.5) * 2.0;
          }
          p.el.setAttribute('position', pos);
        });
      }
    });
  </script>
</head>
<body>

  <!-- 操作ガイドの表示 -->
  <div id="info-overlay">
    <div>状態: <span id="status">マーカーをかざしてARを起動してください</span></div>
    <div style="margin-top: 4px; font-size: 10px; color: #ddd;">撮影された写真は全員の共有ギャラリーに送られます</div>
  </div>

  <!-- 下部操作エリア -->
  <div id="action-container">
    <button id="shutter-btn" title="写真を撮影"></button>
    <button id="gallery-toggle-btn" title="みんなの共有アルバム">🖼️</button>
  </div>

  <!-- 共有ギャラリーモーダル -->
  <div id="gallery-modal">
    <div id="gallery-header">
      <div id="gallery-title">🌸 フォトハーモニー（共有ギャラリー）</div>
      <button id="gallery-close-btn">&times;</button>
    </div>
    <div id="gallery-grid">
      <!-- リアルタイムで追加される写真エリア -->
    </div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="rawHanamiImg" src="1.jpg" crossorigin="anonymous">
    </a-assets>

    <!-- カメラの前方に常時表示するARグループ -->
    <a-camera position="0 0 0" look-controls="enabled: false">
      <a-entity id="persistentAR" visible="false" position="0 0 -1.5">
        <a-plane 
          id="slidePlane" 
          position="0 0 0" 
          width="1.1" 
          height="1.55" 
          scale="1 1 1"
          material="shader: flat; transparent: true;">
        </a-plane>
        <a-entity sakura-rain></a-entity>
      </a-entity>
    </a-camera>

    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0"></a-entity>

  </a-scene>

  <script>
    const statusEl = document.getElementById('status');
    const sceneEl = document.querySelector('a-scene');
    const targetEntity = document.querySelector('#targetEntity');
    const persistentAR = document.querySelector('#persistentAR');
    const slidePlane = document.querySelector('#slidePlane');
    const shutterBtn = document.getElementById('shutter-btn');
    const galleryToggleBtn = document.getElementById('gallery-toggle-btn');
    const galleryModal = document.getElementById('gallery-modal');
    const galleryCloseBtn = document.getElementById('gallery-close-btn');
    const galleryGrid = document.getElementById('gallery-grid');

    let isActivated = false;

    // 1.jpgの透過処理
    function setupTransparentImage() {
      const img = document.getElementById('rawHanamiImg');
      const processImage = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth || img.width;
        canvas.height = img.naturalHeight || img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        try {
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imgData.data;
          for (let i = 0; i < data.length; i += 4) {
            if (data[i] > 215 && data[i+1] > 215 && data[i+2] > 215) {
              data[i+3] = 0; 
            }
          }
          ctx.putImageData(imgData, 0, 0);
          slidePlane.setAttribute('material', 'src', canvas.toDataURL('image/png'));
        } catch (e) {
          slidePlane.setAttribute('material', 'src', '#rawHanamiImg');
        }
      };

      if (img.complete) processImage();
      else img.onload = processImage;
    }
    setupTransparentImage();

    // ARイベント制御
    sceneEl.addEventListener("arReady", () => {
      statusEl.textContent = "カメラ起動完了。マーカーをかざしてください";
    });

    sceneEl.addEventListener("arError", () => {
      statusEl.textContent = "エラー: targets.mind の読み込み失敗";
      statusEl.className = "error";
    });

    targetEntity.addEventListener('targetFound', () => {
      if (!isActivated) {
        isActivated = true;
        persistentAR.setAttribute('visible', 'true');
        statusEl.textContent = "AR起動完了！撮影ボタンで写真を共有できます";
        statusEl.className = "success";
      }
    });

    // 2本指のピンチイン/アウト（拡大縮小）
    let initialDistance = null;
    let initialScale = 1;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (slidePlane) {
          const s = slidePlane.getAttribute('scale');
          if (s) initialScale = s.x;
        }
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!slidePlane || !isActivated) return;
      if (e.touches.length === 2 && initialDistance !== null && initialDistance > 0) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        let newScale = Math.max(0.3, Math.min(2.5, initialScale * factor));
        slidePlane.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialDistance = null;
    });

    // --- フォトハーモニー（写真共有 & ローカル同期機能） ---
    const STORAGE_KEY = 'photo_harmony_gallery';

    function getSharedGallery() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    function saveToSharedGallery(dataUrl) {
      const photos = getSharedGallery();
      photos.unshift(dataUrl); // 最新画像を先頭に追加
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(photos));
      } catch (e) {
        // 容量オーバー時は古い画像を間引く
        photos.pop();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(photos));
      }
      renderGallery();
    }

    function renderGallery() {
      const photos = getSharedGallery();
      galleryGrid.innerHTML = '';
      if (photos.length === 0) {
        galleryGrid.innerHTML = '<div class="empty-msg">まだ写真がありません。<br>ARカメラで撮影して記録を残しましょう！</div>';
        return;
      }
      photos.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.onclick = () => {
          // タップでダウンロード
          const a = document.createElement('a');
          a.href = src;
          a.download = 'harmony_photo_' + Date.now() + '.png';
          a.click();
        };
        galleryGrid.appendChild(img);
      });
    }

    // ギャラリーモーダルの開閉
    galleryToggleBtn.addEventListener('click', () => {
      renderGallery();
      galleryModal.style.display = 'flex';
    });
    galleryCloseBtn.addEventListener('click', () => {
      galleryModal.style.display = 'none';
    });

    // シャッター機能（撮影 ＋ 端末保存 ＋ 共有ギャラリーへ追加）
    shutterBtn.addEventListener('click', () => {
      if (!isActivated) {
        alert("まず一度マーカーをかざしてARを起動してください！");
        return;
      }

      const videoEl = document.querySelector('video');
      const arCanvas = sceneEl.renderer.domElement;

      const canvas = document.createElement('canvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');

      // 1. カメラ映像を描画
      if (videoEl) {
        ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
      }

      // 2. ARエフェクトを重ねて合成
      ctx.drawImage(arCanvas, 0, 0, canvas.width, canvas.height);

      const dataUrl = canvas.toDataURL('image/png');

      // 3. ローカル/共有アルバムに保存
      saveToSharedGallery(dataUrl);

      // 4. ユーザー端末に保存（ダウンロード）
      const link = document.createElement('a');
      link.download = 'photo_harmony_' + Date.now() + '.png';
      link.href = dataUrl;
      link.click();

      // フィードバック
      statusEl.textContent = "撮影成功！共有アルバムに保存しました";
      setTimeout(() => {
        statusEl.textContent = "AR起動完了！撮影ボタンで写真を共有できます";
      }, 3000);
    });
  </script>
</body>
</html>
